AWSTemplateFormatVersion: "2010-09-09"
Description: Aussie EcoGuard - AWS resources (backbone)

Parameters:
  # Base URL of the Cloud Run inference service, e.g. https://<service>-<hash>.a.run.app
  # deploy_aws.sh reads it from $INFERENCE_URL or asks gcloud for it.
  InferenceUrl:
    Type: String
    AllowedPattern: "https://[^/]+"
    ConstraintDescription: an https:// base URL with no path or trailing slash

Resources:
  # Private bucket for user media: originals in uploads/, thumbnails in thumbnails/.
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Bucket names are global, so the account ID keeps this one unique.
      BucketName: !Sub "aussie-ecoguard-media-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Publish every object event to the default EventBridge bus,
      # where rules route uploads/ events to the processing Lambdas.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      # The browser PUTs files directly with a presigned URL,
      # sending the SHA-256 checksum header that S3 verifies.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            # Only pages served from the website bucket (or a local dev server) may call it.
            AllowedOrigins:
              - !Sub "https://${WebsiteBucket.DomainName}"
              - !Sub "http://${WebsiteBucket}.s3-website-${AWS::Region}.amazonaws.com"
              - "http://localhost:8000"
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  # Public bucket that hosts the web UI (HTML/JS only, no user data),
  # set up the same way as the Week 9 lab.
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aussie-ecoguard-web-${AWS::AccountId}"
      # Allow a public bucket policy; ACLs stay blocked since the policy is all we need.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"

  # Single table for file metadata and tags.
  #   META item:          {file_id, sk: "META", status, file_url, thumb_url, file_type, ...}
  #   one item per tag:   {file_id, sk: "TAG#fox", tag: "fox", tag_count: 2}
  MediaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aussie-ecoguard-media
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: file_id # SHA-256 of the file
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: tag
          AttributeType: S
        - AttributeName: tag_count # "count" is a DynamoDB reserved word
          AttributeType: N
      KeySchema:
        - AttributeName: file_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # Sparse index: only TAG# items have a "tag" attribute, so META items
      # stay out of it. Answers "tag = fox AND tag_count >= 2".
      GlobalSecondaryIndexes:
        - IndexName: tag-count-index
          KeySchema:
            - AttributeName: tag
              KeyType: HASH
            - AttributeName: tag_count
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      # Abandoned PENDING items (URL issued, never uploaded) carry expires_at
      # and are deleted automatically, usually within a few days of expiring.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Reserves a checksum in MediaTable and returns a presigned PUT URL.
  UploadUrlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aussie-ecoguard-upload-url
      Runtime: python3.12
      Handler: app.handler
      # Local folder; `aws cloudformation package` (deploy_aws.sh) zips it,
      # uploads it to S3 and rewrites this to the S3 location.
      Code: ../lambdas/upload_url/
      # Learner Lab cannot create IAM roles, so every function uses LabRole.
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref MediaTable
          BUCKET_NAME: !Ref MediaBucket
          URL_EXPIRES: "900"
          PENDING_TTL: "86400" # 24h before an unused reservation is cleaned up

  # ---------- Tagging: S3 -> EventBridge -> SQS -> TaggingFunction -> Cloud Run ----------

  # Sends every new object under uploads/ to the tagging queue.
  UploadCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: aussie-ecoguard-upload-created
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref MediaBucket]
          object:
            key: [{ prefix: uploads/ }]
      Targets:
        - Id: tagging-queue
          Arn: !GetAtt TaggingQueue.Arn

  # Buffers uploads so at most MaximumConcurrency files are tagged at once,
  # however many arrive together. Cloud Run only has a few instances.
  TaggingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: aussie-ecoguard-tagging
      # AWS recommends at least 6x the function timeout (75 s), leaving room
      # for Lambda to retry if it is throttled. A failed attempt also becomes
      # visible again after this long, so it is the delay between retries.
      VisibilityTimeout: 450
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TaggingDeadLetterQueue.Arn
        # AWS recommends at least 5. The function gives up and writes FAILED
        # on attempt MAX_ATTEMPTS (3), so only messages whose function keeps
        # crashing or timing out reach the dead-letter queue.
        maxReceiveCount: 5

  # Messages that failed every delivery. Their files stay PROCESSING; use
  # "Start DLQ redrive" in the SQS console to send them back for another try.
  TaggingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: aussie-ecoguard-tagging-dlq
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  # Resource-based policy: lets the EventBridge rule (and only that rule)
  # send messages to the queue. LabRole is not involved here.
  TaggingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref TaggingQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt TaggingQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt UploadCreatedRule.Arn

  # Runs inference on a new upload and saves the tags (lambdas/tagging).
  TaggingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aussie-ecoguard-tagging
      Runtime: python3.12
      Handler: app.handler
      Code: ../lambdas/tagging/
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      MemorySize: 128
      # One Cloud Run call (INFER_TIMEOUT) plus time for DynamoDB and S3.
      Timeout: 75
      Environment:
        Variables:
          TABLE_NAME: !Ref MediaTable
          BUCKET_NAME: !Ref MediaBucket
          INFERENCE_URL: !Ref InferenceUrl
          MAX_ATTEMPTS: "3" # must stay below the queue's maxReceiveCount
          INFER_TIMEOUT: "60" # same as the Cloud Run request timeout

  # Lambda polls the queue and invokes the function with one message at a time.
  TaggingEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TaggingQueue.Arn
      FunctionName: !Ref TaggingFunction
      BatchSize: 1
      ScalingConfig:
        MaximumConcurrency: 2 # the minimum allowed; matches Cloud Run max-instances

  # ---------- REST API: POST /upload-url -> UploadUrlFunction ----------

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: aussie-ecoguard-api
      EndpointConfiguration:
        Types: [REGIONAL]

  UploadUrlResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: upload-url

  # Lambda proxy integration: API Gateway passes the whole HTTP request to the
  # function as `event` and returns the function's {statusCode, headers, body}.
  UploadUrlPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref UploadUrlResource
      HttpMethod: POST
      AuthorizationType: NONE # TODO(cognito): COGNITO_USER_POOLS + AuthorizerId
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST # Lambda is always invoked with POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadUrlFunction.Arn}/invocations"

  # CORS preflight. A JSON POST from the website (another origin) makes the
  # browser send OPTIONS first; this answers it without invoking Lambda.
  UploadUrlOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref UploadUrlResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # ---------- REST API: GET /files and GET /files/{sha256} -> FilesFunction ----------

  # Lists files with their tags, and returns one file's status for polling (lambdas/files).
  FilesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aussie-ecoguard-files
      Runtime: python3.12
      Handler: app.handler
      Code: ../lambdas/files/
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref MediaTable
          BUCKET_NAME: !Ref MediaBucket
          PREVIEW_URL_EXPIRES: "3600"
          URL_EXPIRES: "900" # keep equal to UploadUrlFunction's URL_EXPIRES

  FilesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: files

  # {sha256} is a path parameter; Lambda finds it in event["pathParameters"].
  FileResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref FilesResource
      PathPart: "{sha256}"

  # A GET without custom headers is a "simple" cross-origin request, so the
  # browser sends no preflight and these routes need no OPTIONS method yet.
  # TODO(cognito): the Authorization header will trigger preflights; add OPTIONS then.
  FilesGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref FilesResource
      HttpMethod: GET
      AuthorizationType: NONE # TODO(cognito)
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FilesFunction.Arn}/invocations"

  FileGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref FileResource
      HttpMethod: GET
      AuthorizationType: NONE # TODO(cognito)
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FilesFunction.Arn}/invocations"

  # Lets this API invoke the function for GET /files and GET /files/<anything>.
  FilesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FilesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/GET/files*"

  # A deployment is a snapshot of the API; the stage "api" serves it at
  # https://<api-id>.execute-api.<region>.amazonaws.com/api/...
  # CloudFormation only creates this snapshot once, so deploy_aws.sh takes a new
  # one after every stack update.
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [UploadUrlPost, UploadUrlOptions, FilesGet, FileGet]
    Properties:
      RestApiId: !Ref Api

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: api

  # Resource-based policy on the function: lets this API (and only this
  # route) invoke it. LabRole is not involved here.
  UploadUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadUrlFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/upload-url"

Outputs:
  MediaBucketName:
    Value: !Ref MediaBucket
  MediaTableName:
    Value: !Ref MediaTable
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  # HTTPS: use this one, browser SHA-256 (crypto.subtle) only works over HTTPS.
  WebsiteHttpsURL:
    Value: !Sub "https://${WebsiteBucket.DomainName}/index.html"
  # HTTP-only static website endpoint, as in the Week 9 lab.
  WebsiteEndpointURL:
    Value: !GetAtt WebsiteBucket.WebsiteURL
  UploadUrlFunctionName:
    Value: !Ref UploadUrlFunction
  ApiId:
    Value: !Ref Api
  # Base URL of the REST API; the website appends /upload-url etc. to it.
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}"
  TaggingFunctionName:
    Value: !Ref TaggingFunction
  TaggingQueueUrl:
    Value: !Ref TaggingQueue
  TaggingDeadLetterQueueUrl:
    Value: !Ref TaggingDeadLetterQueue
  UploadUrlEndpoint:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}/upload-url"
