AWSTemplateFormatVersion: "2010-09-09"
Description: Aussie EcoGuard - AWS resources (backbone)

Resources:
  # Private bucket for user media: originals in uploads/, thumbnails in thumbnails/.
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Bucket names are global, so the account ID keeps this one unique.
      BucketName: !Sub "aussie-ecoguard-media-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Publish every object event to the default EventBridge bus,
      # where rules route uploads/ events to the processing Lambdas.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      # The browser PUTs files directly with a presigned URL,
      # sending the SHA-256 checksum header that S3 verifies.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            # Only pages served from the website bucket (or a local dev server) may call it.
            AllowedOrigins:
              - !Sub "https://${WebsiteBucket.DomainName}"
              - !Sub "http://${WebsiteBucket}.s3-website-${AWS::Region}.amazonaws.com"
              - "http://localhost:8000"
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  # Public bucket that hosts the web UI (HTML/JS only, no user data),
  # set up the same way as the Week 9 lab.
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aussie-ecoguard-web-${AWS::AccountId}"
      # Allow a public bucket policy; ACLs stay blocked since the policy is all we need.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"

  # Single table for file metadata and tags.
  #   META item:          {file_id, sk: "META", file_url, thumb_url, file_type, ...}
  #   one item per tag:   {file_id, sk: "TAG#fox", tag: "fox", tag_count: 2}
  MediaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aussie-ecoguard-media
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: file_id # SHA-256 of the file
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: tag
          AttributeType: S
        - AttributeName: tag_count # "count" is a DynamoDB reserved word
          AttributeType: N
      KeySchema:
        - AttributeName: file_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # Sparse index: only TAG# items have a "tag" attribute, so META items
      # stay out of it. Answers "tag = fox AND tag_count >= 2".
      GlobalSecondaryIndexes:
        - IndexName: tag-count-index
          KeySchema:
            - AttributeName: tag
              KeyType: HASH
            - AttributeName: tag_count
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      # Abandoned PENDING items (URL issued, never uploaded) carry expires_at
      # and are deleted automatically, usually within a few days of expiring.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Reserves a checksum in MediaTable and returns a presigned PUT URL.
  UploadUrlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aussie-ecoguard-upload-url
      Runtime: python3.12
      Handler: app.handler
      # Local folder; `aws cloudformation package` (deploy.sh) zips it,
      # uploads it to S3 and rewrites this to the S3 location.
      Code: ../lambdas/upload_url/
      # Learner Lab cannot create IAM roles, so every function uses LabRole.
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref MediaTable
          BUCKET_NAME: !Ref MediaBucket
          URL_EXPIRES: "900"
          PENDING_TTL: "86400" # 24h before an unused reservation is cleaned up

  # ---------- REST API: POST /upload-url -> UploadUrlFunction ----------

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: aussie-ecoguard-api
      EndpointConfiguration:
        Types: [REGIONAL]

  UploadUrlResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: upload-url

  # Lambda proxy integration: API Gateway passes the whole HTTP request to the
  # function as `event` and returns the function's {statusCode, headers, body}.
  UploadUrlPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref UploadUrlResource
      HttpMethod: POST
      AuthorizationType: NONE # TODO(cognito): COGNITO_USER_POOLS + AuthorizerId
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST # Lambda is always invoked with POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadUrlFunction.Arn}/invocations"

  # CORS preflight. A JSON POST from the website (another origin) makes the
  # browser send OPTIONS first; this answers it without invoking Lambda.
  UploadUrlOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref UploadUrlResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # A deployment is a snapshot of the API; the stage "api" serves it at
  # https://<api-id>.execute-api.<region>.amazonaws.com/api/...
  # CloudFormation only creates this snapshot once, so deploy.sh takes a new
  # one after every stack update.
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [UploadUrlPost, UploadUrlOptions]
    Properties:
      RestApiId: !Ref Api

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: api

  # Resource-based policy on the function: lets this API (and only this
  # route) invoke it. LabRole is not involved here.
  UploadUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadUrlFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/upload-url"

Outputs:
  MediaBucketName:
    Value: !Ref MediaBucket
  MediaTableName:
    Value: !Ref MediaTable
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  # HTTPS: use this one, browser SHA-256 (crypto.subtle) only works over HTTPS.
  WebsiteHttpsURL:
    Value: !Sub "https://${WebsiteBucket.DomainName}/index.html"
  # HTTP-only static website endpoint, as in the Week 9 lab.
  WebsiteEndpointURL:
    Value: !GetAtt WebsiteBucket.WebsiteURL
  UploadUrlFunctionName:
    Value: !Ref UploadUrlFunction
  ApiId:
    Value: !Ref Api
  UploadUrlEndpoint:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}/upload-url"
