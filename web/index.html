<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aussie EcoGuard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Aussie EcoGuard</h1>
    <p>Upload camera-trap photos and videos. Each file is checked for duplicates, stored, and tagged with the species it shows.</p>

    <!-- Shown by app.js when the page cannot work (no HTTPS, no config.js). -->
    <p id="warning" class="error" hidden></p>

    <label class="picker">
      Choose files (.jpg, .png, .mp4, .mov, up to 500 MB each)
      <input id="files" type="file" multiple accept=".jpg,.jpeg,.png,.mp4,.mov">
    </label>

    <ul id="results"></ul>
  </main>

  <!-- config.js is generated by infra/deploy_aws.sh and sets window.CONFIG. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
