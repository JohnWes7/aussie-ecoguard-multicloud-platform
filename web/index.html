<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aussie EcoGuard</title>
  <!-- Bootstrap from a CDN: no build step. integrity makes the browser refuse a modified file. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<!-- auth-pending hides the page until auth.js has a token (style.css). -->
<body class="bg-body-tertiary auth-pending">
  <nav class="navbar bg-dark" data-bs-theme="dark">
    <div class="container">
      <span class="navbar-brand">Aussie EcoGuard</span>
      <!-- Filled in by auth.js after sign-in. -->
      <div class="d-flex align-items-center gap-2">
        <span id="user-name" class="navbar-text"></span>
        <button id="sign-out" class="btn btn-outline-light btn-sm" type="button" hidden>Sign out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Shown by upload.js / library.js when the page cannot work (no HTTPS, no config.js). -->
    <div id="warning" class="alert alert-danger" hidden></div>

    <!-- One tab per feature. Search, chatbot and notifications get their own tabs later. -->
    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#library-tab" type="button" role="tab">Library</button>
      </li>
    </ul>

    <div class="tab-content">
      <section id="library-tab" class="tab-pane fade show active" role="tabpanel">

        <!-- Upload panel (upload.js): only talks to POST /upload-url and S3. -->
        <div class="card mb-4">
          <div class="card-header fw-semibold">Upload</div>
          <div class="card-body">
            <input id="files" class="form-control" type="file" multiple accept=".jpg,.jpeg,.png,.mp4,.mov">
            <div class="form-text">Photos (.jpg, .png) and videos (.mp4, .mov), up to 500 MB each. Duplicates are detected by checksum.</div>
            <ul id="uploads" class="list-group mt-3"></ul>
          </div>
        </div>

        <!-- Library (library.js): only talks to GET /files and GET /files/{sha256}. -->
        <div class="d-flex align-items-center mb-3">
          <h2 class="h5 mb-0">Files <span id="file-count" class="badge text-bg-secondary"></span></h2>
          <button id="refresh" class="btn btn-outline-secondary btn-sm ms-auto" type="button">Refresh</button>
        </div>
        <div id="library-error" class="alert alert-warning" hidden></div>
        <div id="library" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3"></div>

      </section>
    </div>
  </main>
  <!-- Toast messages appear here (toast.js: showToast(message, type)). -->
  <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- config.js sets window.CONFIG; Terraform uploads it (infra/terraform/website.tf). -->
  <script src="config.js"></script>
  <!-- Before the other scripts: they call getIdToken(). -->
  <script src="auth.js"></script>
  <script src="toast.js"></script>
  <!-- detectFile(file): species in an image, nothing stored (for the searches). -->
  <script src="detect.js"></script>
  <script src="upload.js"></script>
  <script src="library.js"></script>
  <!-- Adds the Notifications tab itself. -->
  <script src="subscribe.js"></script>
  <!-- Adds the Lost pet tab (lost pet search, thumbnail URL -> original). -->
  <script src="lostpet.js"></script>
</body>
</html>
